[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "draw-animation"
version = "0.1.0"
description = "Desktop batch tool that turns still images into whiteboard drawing animations."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python>=4.9,<5",
]

[tool.setuptools.packages.find]
include = ["draw_animation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
